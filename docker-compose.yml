services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: logistics_os
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics_os"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://logistics:logistics_dev@postgres:5432/logistics_os?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
